# Release: build, test and package Lantern on each system, and attach the
# zips to a draft GitHub release whose notes are that version's section of
# CHANGELOG.md. See docs/releasing.md.
#
# Two ways to start it:
#   * push a version tag (v0.9.0-alpha...);
#   * or, on GitHub: Actions > Release > Run workflow, typing the version
#     (e.g. 0.9.0-alpha). The release then creates the tag on that commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in CHANGELOG.md (e.g. 0.9.0-alpha)"
        required: true

env:
  # The tag of this release: the pushed tag, or v + the version typed in.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches CMakeLists.txt
        shell: bash
        run: |
          major_minor_patch=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          suffix=$(sed -n 's/^set(LANTERN_VERSION_SUFFIX "\(.*\)")$/\1/p' CMakeLists.txt)
          if [ "v${major_minor_patch}${suffix}" != "$TAG" ]; then
            echo "Releasing $TAG, but CMakeLists.txt says v${major_minor_patch}${suffix}" >&2
            exit 1
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (release)
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset release

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --preset release

      - name: Test (Windows, without window tests)
        if: runner.os == 'Windows'
        run: ctest --preset release -LE window   # no OpenGL 3 screen on these machines

      - name: Package
        run: cmake --build --preset package

      # A program that cannot find a DLL does not start on players' PCs,
      # while it may still start here (build folders are on the PATH).
      - name: Check the macOS package's signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/Lantern-*/lantern_editor.app

      - name: Check the Windows package's DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install pefile
          python tools/release/check_windows_dlls.py "$(ls -d dist/Lantern-*/ | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ runner.os }}
          path: dist/*.zip

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          # The section for this version: from its "## 0.9.0-alpha" heading
          # to the next "## " heading.
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        # An earlier *draft* of this version (a failed or repeated run) is
        # replaced; a published release is never touched.
        # --target: when the tag does not exist yet (Run workflow), it is
        # made on the commit that was built.
        run: |
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes --repo "${{ github.repository }}"
          fi
          gh release create "$TAG" dist/*.zip --draft --target "${{ github.sha }}" --repo "${{ github.repository }}" --title "Lantern $TAG" --notes-file notes.md
