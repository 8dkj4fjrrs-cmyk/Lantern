# Release: on a version tag (v0.9.0-alpha...), build, test and package
# Lantern on each system, and attach the zips to a draft GitHub release
# whose notes are that version's section of CHANGELOG.md. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (release)
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset release

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --preset release

      - name: Test (Windows, without window tests)
        if: runner.os == 'Windows'
        run: ctest --preset release -LE window   # no OpenGL 3 screen on these machines

      - name: Package
        run: cmake --build --preset package

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ runner.os }}
          path: dist/*.zip

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          # The section for this version: from its "## 0.9.0-alpha" heading
          # to the next "## " heading.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --draft --repo "${{ github.repository }}" --title "Lantern ${{ github.ref_name }}" --notes-file notes.md
