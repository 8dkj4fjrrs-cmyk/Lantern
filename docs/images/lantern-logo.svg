<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lantern Engine</title>
  <defs>
    <!-- Night sky behind the lantern. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d52"/>
      <stop offset="1" stop-color="#121529"/>
    </linearGradient>
    <!-- The warm light the flame throws around it. -->
    <radialGradient id="halo" cx="256" cy="282" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <!-- Lit glass: bright in the middle, amber at the edges. -->
    <radialGradient id="glass" cx="256" cy="282" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#ffc85c"/>
      <stop offset="1" stop-color="#e07a1f"/>
    </radialGradient>
    <!-- Bronze for the frame, lit from the front. -->
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a4f1f"/>
      <stop offset="0.5" stop-color="#d9964a"/>
      <stop offset="1" stop-color="#8a4f1f"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a14"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#fff6d6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- Rounded tile, like an app icon. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sky)"/>
  <!-- A faint edge, so the tile stands out on dark pages too. -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#4a5590" stroke-opacity="0.6" stroke-width="3"/>
  <g clip-path="url(#tile)">
    <circle cx="256" cy="282" r="230" fill="url(#halo)"/>
    <!-- A few stars. -->
    <g fill="#fff6d6">
      <circle cx="104" cy="112" r="4" opacity="0.8"/>
      <circle cx="404" cy="96" r="3" opacity="0.7"/>
      <circle cx="420" cy="196" r="2.5" opacity="0.5"/>
      <circle cx="84" cy="236" r="2.5" opacity="0.5"/>
      <circle cx="140" cy="60" r="2" opacity="0.5"/>
    </g>
  </g>

  <!-- Hanging ring and hook. -->
  <circle cx="256" cy="82" r="24" fill="none" stroke="#d9964a" stroke-width="11"/>
  <rect x="249" y="102" width="14" height="22" rx="4" fill="#b06e30"/>

  <!-- Roof. -->
  <path d="M198 128 H314 L350 168 H162 Z" fill="url(#bronze)"/>
  <rect x="150" y="164" width="212" height="16" rx="7" fill="#b06e30"/>

  <!-- Glass with the light inside. -->
  <rect x="176" y="180" width="160" height="196" rx="10" fill="url(#glass)"/>

  <!-- Flame. -->
  <path d="M256 214 C286 254 300 278 300 304 C300 332 280 350 256 350 C232 350 212 332 212 304 C212 278 226 254 256 214 Z"
        fill="url(#flameOuter)"/>
  <path d="M256 258 C272 282 280 296 280 312 C280 330 269 340 256 340 C243 340 232 330 232 312 C232 296 240 282 256 258 Z"
        fill="url(#flameInner)"/>

  <!-- Frame bars over the glass. -->
  <g fill="url(#bronze)">
    <rect x="168" y="180" width="16" height="196" rx="5"/>
    <rect x="328" y="180" width="16" height="196" rx="5"/>
  </g>
  <rect x="216" y="180" width="6" height="196" fill="#b06e30" opacity="0.55"/>
  <rect x="290" y="180" width="6" height="196" fill="#b06e30" opacity="0.55"/>

  <!-- Base. -->
  <rect x="150" y="372" width="212" height="22" rx="8" fill="#b06e30"/>
  <path d="M176 394 H336 L320 420 H192 Z" fill="url(#bronze)"/>
</svg>
